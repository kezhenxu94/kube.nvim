apiVersion: v1
kind: Namespace
metadata:
  name: kube-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kube-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kube-e2e
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: kube-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do echo log-line-$i; i=$((i+1)); sleep 1; done"]
---
apiVersion: v1
kind: Secret
metadata:
  name: db
  namespace: kube-e2e
stringData:
  username: admin
  password: "s3cret"
