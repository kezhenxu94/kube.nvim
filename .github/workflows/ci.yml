name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.editor }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported versions, the latest releases and nightly
          - { editor: vim, version: v9.2.0000 }
          - { editor: vim, version: nightly }
          - { editor: nvim, version: v0.11.0 }
          - { editor: nvim, version: stable }
          - { editor: nvim, version: nightly }
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          neovim: ${{ matrix.editor == 'nvim' }}
          version: ${{ matrix.version }}
      - run: make test-${{ matrix.editor }} VIM=${{ steps.vim.outputs.executable }} NVIM=${{ steps.vim.outputs.executable }}

  e2e:
    name: e2e (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          version: nightly
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
          version: stable
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.23.0
      - uses: azure/setup-helm@v5
      - run: make test-e2e VIM=${{ steps.vim.outputs.executable }} NVIM=${{ steps.nvim.outputs.executable }}
      - if: failure()
        run: KUBECONFIG=.e2e-kubeconfig kubectl --context kind-kube-nvim-e2e -n kube-e2e get all,events
